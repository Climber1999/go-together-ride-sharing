name: CI/CD

on:
  pull_request:
    branches:
      - development
      - staging
      - main
  push:
    branches:
      - development
      - staging
      - main
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test-java:
    name: Test ${{ matrix.service }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - service: user-service
            path: GoTogether-dev
          - service: booking-service
            path: Booking-1
          - service: ride-service
            path: GoTogether-ride
          - service: api-gateway
            path: trueme-api-gateway
    defaults:
      run:
        working-directory: ${{ matrix.path }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: maven
          cache-dependency-path: ${{ matrix.path }}/pom.xml
      - run: mvn --batch-mode -Dmaven.test.skip=false verify

  test-vehicle:
    name: Test vehicle service
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 8.0.x
      - run: dotnet test VehicleService/VehicleService.sln --configuration Release

  test-frontend:
    name: Build frontend
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: Car Sharing Platform (2)/package-lock.json
      - run: npm ci
        working-directory: Car Sharing Platform (2)
      - run: npm run build
        working-directory: Car Sharing Platform (2)

  publish:
    name: Push ${{ matrix.service }} to ECR
    if: github.event_name != 'pull_request'
    needs:
      - test-java
      - test-vehicle
      - test-frontend
    runs-on: ubuntu-latest
    environment:
      name: ${{ github.ref_name == 'main' && 'production' || github.ref_name }}
    permissions:
      contents: read
      id-token: write
    strategy:
      fail-fast: false
      matrix:
        include:
          - service: user-service
            context: GoTogether-dev
          - service: booking-service
            context: Booking-1
          - service: ride-service
            context: GoTogether-ride
          - service: vehicle-service
            context: VehicleService
          - service: api-gateway
            context: trueme-api-gateway
          - service: frontend
            context: Car Sharing Platform (2)
    steps:
      - uses: actions/checkout@v4
      - uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.AWS_ROLE_ARN }}
          aws-region: ${{ vars.AWS_REGION }}
      - uses: aws-actions/amazon-ecr-login@v2
        id: ecr
      - name: Set deployment environment
        id: environment
        shell: bash
        run: |
          case "$GITHUB_REF_NAME" in
            development|staging) echo "name=$GITHUB_REF_NAME" >> "$GITHUB_OUTPUT" ;;
            main) echo "name=production" >> "$GITHUB_OUTPUT" ;;
            *) echo "Unsupported deployment branch: $GITHUB_REF_NAME" >&2; exit 1 ;;
          esac
      - uses: docker/build-push-action@v6
        with:
          context: ${{ matrix.context }}
          file: ${{ matrix.context }}/Dockerfile
          push: true
          tags: ${{ steps.ecr.outputs.registry }}/gotogether-${{ steps.environment.outputs.name }}-${{ matrix.service }}:${{ github.sha }}
          build-args: |
            VITE_API_BASE_URL=${{ vars.VITE_API_BASE_URL }}

  deploy:
    name: Deploy ${{ matrix.service }} to ECS
    if: github.event_name != 'pull_request'
    needs: publish
    runs-on: ubuntu-latest
    environment:
      name: ${{ github.ref_name == 'main' && 'production' || github.ref_name }}
    permissions:
      contents: read
      id-token: write
    strategy:
      fail-fast: false
      matrix:
        service:
          - user-service
          - booking-service
          - ride-service
          - vehicle-service
          - api-gateway
          - frontend
    steps:
      - uses: actions/checkout@v4
      - uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.AWS_ROLE_ARN }}
          aws-region: ${{ vars.AWS_REGION }}
      - name: Set deployment environment
        id: environment
        shell: bash
        run: |
          case "$GITHUB_REF_NAME" in
            development|staging) echo "name=$GITHUB_REF_NAME" >> "$GITHUB_OUTPUT" ;;
            main) echo "name=production" >> "$GITHUB_OUTPUT" ;;
            *) echo "Unsupported deployment branch: $GITHUB_REF_NAME" >&2; exit 1 ;;
          esac
      - name: Register task definition and deploy
        env:
          AWS_ACCOUNT_ID: ${{ vars.AWS_ACCOUNT_ID }}
          ECS_CLUSTER: ${{ vars.ECS_CLUSTER }}
          ECS_SERVICE: gotogether-${{ steps.environment.outputs.name }}-${{ matrix.service }}
          IMAGE: ${{ vars.AWS_ACCOUNT_ID }}.dkr.ecr.${{ vars.AWS_REGION }}.amazonaws.com/gotogether-${{ steps.environment.outputs.name }}-${{ matrix.service }}:${{ github.sha }}
        shell: bash
        run: |
          set -euo pipefail
          task_definition_arn="$(aws ecs describe-services \
            --cluster "$ECS_CLUSTER" \
            --services "$ECS_SERVICE" \
            --query 'services[0].taskDefinition' \
            --output text)"
          aws ecs describe-task-definition \
            --task-definition "$task_definition_arn" \
            --query taskDefinition \
            --output json > task-definition.json
          jq --arg name '${{ matrix.service }}' --arg image "$IMAGE" '
            .containerDefinitions |= map(if .name == $name then .image = $image else . end)
            | del(.taskDefinitionArn, .revision, .status, .requiresAttributes, .compatibilities, .registeredAt, .registeredBy)
          ' task-definition.json > rendered-task-definition.json
          if ! jq -e --arg name '${{ matrix.service }}' '.containerDefinitions | any(.name == $name)' rendered-task-definition.json >/dev/null; then
            echo "Container '${{ matrix.service }}' is missing from ECS task definition." >&2
            exit 1
          fi
          new_task_definition_arn="$(aws ecs register-task-definition \
            --cli-input-json file://rendered-task-definition.json \
            --query 'taskDefinition.taskDefinitionArn' \
            --output text)"
          aws ecs update-service \
            --cluster "$ECS_CLUSTER" \
            --service "$ECS_SERVICE" \
            --task-definition "$new_task_definition_arn" \
            --desired-count 1 >/dev/null
          aws ecs wait services-stable --cluster "$ECS_CLUSTER" --services "$ECS_SERVICE"
