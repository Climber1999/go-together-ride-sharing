version: "3.9"

services:
  app:
    build:
      context: .
    env_file:
      - .env.development
    ports:
      - "5000:5000"
    environment:
      NODE_ENV: development
    depends_on:
      - postgres
      - redis

  postgres:
    image: postgres:15
    environment:
      POSTGRES_DB: gotogether_dev
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    ports:
      - "5432:5432"
    volumes:
      - postgres_dev_data:/var/lib/postgresql/data

  redis:
    image: redis:7
    ports:
      - "6379:6379"
    volumes:
      - redis_dev_data:/var/lib/redis/data

volumes:
  postgres_dev_data:
  redis_dev_data:
